---
name: Check for spelling with vale

on:
  pull_request:
    branches: [ main ]

permissions: {} # lock everything by default (least-privilege)

jobs:
  vale:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Vale
        uses: Consensys/github-actions/docs-spelling-check@31dbb917dd78b1dc18b4838a2d7d598b359b834f # main
