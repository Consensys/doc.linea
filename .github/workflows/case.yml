---
name: Check file name case

on:
  pull_request:
    branches: [ main ]
    paths: ['docs/**']

permissions: {} # lock everything by default (least-privilege)

jobs:
  case:
    name: Check for case being inconsistent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ["docs"]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Case check action
        uses: Consensys/github-actions/docs-case-check@31dbb917dd78b1dc18b4838a2d7d598b359b834f # main
        with:
          DOC_DIR: ${{ matrix.folder }}
