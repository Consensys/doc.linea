---
name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel older runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {} # lock everything by default (least-privilege)

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read  # least-privilege for this job only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build docs
        uses: Consensys/github-actions/docs-build@3a2429772a5d3653f0662a6a66299cad96e74196 # main
