<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 706"
  width="100%"
  height="auto"
  role="img"
  aria-labelledby="tl-title tl-desc"
>
  <title id="tl-title">Lineth transaction lifecycle</title>
  <desc id="tl-desc">
    Four stages from submission to finalization. An RPC node submits a transaction
    to a sequencer node. The block goes to the state manager and the tracer, which
    feed the coordinator. The coordinator and prover exchange batches, execution
    proofs, blobs, and compression proofs. The coordinator then submits data and
    proofs to the finalization contract, which records a verified state root on
    the finalization layer.
  </desc>
  <defs>
    <marker id="tl-arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--linea-mermaid-core-stroke)" />
    </marker>
  </defs>
  <g font-family="AtypText, sans-serif" fill="var(--linea-text-primary)">
    <circle cx="28" cy="64" r="12" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="28" y="69" text-anchor="middle" font-size="13" font-weight="600">1</text>
    <text x="48" y="58" font-size="14" font-weight="600">Execute</text>
    <text x="48" y="76" font-size="14" font-weight="600">transactions</text>

    <rect x="196" y="40" width="168" height="52" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="280" y="71" text-anchor="middle" font-size="14">RPC node</text>
    <line x1="364" y1="66" x2="448" y2="66" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="406" y="58" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">transaction</text>
    <rect x="456" y="32" width="292" height="68" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="602" y="58" text-anchor="middle" font-size="14">Sequencer node</text>
    <text x="602" y="78" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">Maru validator and Linea Besu</text>

    <line x1="16" y1="128" x2="764" y2="128" stroke="var(--linea-mermaid-cluster-border)" stroke-width="1" stroke-dasharray="6 5" />

    <circle cx="28" cy="268" r="12" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="28" y="273" text-anchor="middle" font-size="13" font-weight="600">2</text>
    <text x="48" y="262" font-size="14" font-weight="600">Batch and</text>
    <text x="48" y="280" font-size="14" font-weight="600">trace blocks</text>

    <path d="M602 100 V168 H275 V188" fill="none" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <path d="M602 168 H645 V188" fill="none" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="590" y="160" text-anchor="end" font-size="12" fill="var(--linea-text-secondary)">block</text>

    <rect x="180" y="196" width="190" height="52" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="275" y="227" text-anchor="middle" font-size="14">State manager</text>
    <rect x="560" y="196" width="170" height="52" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="645" y="227" text-anchor="middle" font-size="14">Tracer</text>

    <line x1="16" y1="356" x2="764" y2="356" stroke="var(--linea-mermaid-cluster-border)" stroke-width="1" stroke-dasharray="6 5" />

    <path d="M275 248 V300" fill="none" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <path d="M645 248 V322 H368" fill="none" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="292" y="278" font-size="12" fill="var(--linea-text-secondary)">state representation</text>
    <text x="470" y="314" font-size="12" fill="var(--linea-text-secondary)">traces</text>

    <rect x="180" y="308" width="180" height="244" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="270" y="352" text-anchor="middle" font-size="14">Coordinator</text>

    <circle cx="28" cy="466" r="12" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="28" y="471" text-anchor="middle" font-size="13" font-weight="600">3</text>
    <text x="48" y="460" font-size="14" font-weight="600">Generate</text>
    <text x="48" y="478" font-size="14" font-weight="600">validity proofs</text>

    <rect x="560" y="380" width="180" height="160" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="650" y="468" text-anchor="middle" font-size="14">Prover</text>

    <line x1="360" y1="396" x2="552" y2="396" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="456" y="388" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">batches</text>
    <line x1="560" y1="440" x2="368" y2="440" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="456" y="432" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">execution proofs</text>
    <line x1="360" y1="484" x2="552" y2="484" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="456" y="476" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">blobs</text>
    <line x1="560" y1="528" x2="368" y2="528" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="456" y="520" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">compression proofs</text>

    <line x1="16" y1="576" x2="764" y2="576" stroke="var(--linea-mermaid-cluster-border)" stroke-width="1" stroke-dasharray="6 5" />

    <circle cx="28" cy="638" r="12" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="28" y="643" text-anchor="middle" font-size="13" font-weight="600">4</text>
    <text x="48" y="620" font-size="14" font-weight="600">Submit for data</text>
    <text x="48" y="638" font-size="14" font-weight="600">availability and</text>
    <text x="48" y="656" font-size="14" font-weight="600">finalization</text>

    <line x1="270" y1="552" x2="270" y2="604" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="282" y="596" font-size="12" fill="var(--linea-text-secondary)">data and proofs</text>

    <rect x="180" y="612" width="230" height="52" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="295" y="643" text-anchor="middle" font-size="14">Finalization contract</text>
    <line x1="410" y1="638" x2="552" y2="638" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" marker-end="url(#tl-arrow)" />
    <text x="481" y="630" text-anchor="middle" font-size="12" fill="var(--linea-text-secondary)">verified state root</text>
    <rect x="560" y="612" width="200" height="52" rx="4" fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
    <text x="660" y="643" text-anchor="middle" font-size="14">Finalization layer</text>
  </g>
</svg>
